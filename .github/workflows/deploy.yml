name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript and local assets
        run: |
          node --check script.js
          node --check enhancements.js
          node --check features.js
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scriptBlocks = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let inlineCount = 0;
          for (const [, attributes, source] of scriptBlocks) {
            if (/\bsrc\s*=/.test(attributes) || !source.trim()) continue;
            new vm.Script(source, { filename: 'index-inline-' + (++inlineCount) + '.js' });
          }
          const refs = [...html.matchAll(/(?:src|href)=[\"']([^\"']+)[\"']/gi)].map(match => match[1]);
          for (const ref of refs) {
            if (/^(?:https?:)?\/\//i.test(ref) || ref.startsWith('#') || ref.startsWith('data:')) continue;
            const path = ref.split(/[?#]/)[0];
            if (path && !fs.existsSync(path)) throw new Error('Missing local asset: ' + path);
          }
          if (!html.includes('href="features.css"')) throw new Error('features.css is not linked from index.html');
          if (!html.includes('src="features.js"')) throw new Error('features.js is not linked from index.html');
          console.log('Validated ' + inlineCount + ' inline scripts and local asset references.');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
